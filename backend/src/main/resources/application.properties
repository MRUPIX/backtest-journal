spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:journal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:native}

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:}
telegram.bot.polling-enabled=${TELEGRAM_BOT_POLLING_ENABLED:true}
auth.code-secret=${AUTH_CODE_SECRET:}
auth.allow-ephemeral-secret=${AUTH_ALLOW_EPHEMERAL_SECRET:false}
